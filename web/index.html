<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tarot_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>tarot_app</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // 部分内嵌 WebView（比如 Facebook/Messenger 的应用内浏览器）在自己的
    // 工具栏收起/展开、地址栏变化时不会正确触发标准的 resize 事件，导致
    // Flutter Web（CanvasKit）用一个过时的窗口尺寸把画布画小了，右边或
    // 下边留黑边。这里在页面稳定后、以及 visualViewport 变化时都主动
    // 补发一次 resize 事件，让 Flutter 引擎重新measure一次。
    function nudgeResize() {
      window.dispatchEvent(new Event('resize'));
    }
    window.addEventListener('load', function () {
      setTimeout(nudgeResize, 300);
      setTimeout(nudgeResize, 1000);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', nudgeResize);
    }
  </script>
</body>
</html>
